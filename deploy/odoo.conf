[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Database - Railway PostgreSQL se automatically set hoga
db_host = ${PGHOST}
db_port = ${PGPORT}
db_user = ${PGUSER}
db_password = ${PGPASSWORD}
db_name = ${PGDATABASE}

; Server settings
xmlrpc_port = ${PORT}
proxy_mode = True
without_demo = True

; Admin
admin_passwd = ${ODOO_MASTER_PASSWORD}

; Logging
logfile = /var/log/odoo/odoo.log
log_level = warn
